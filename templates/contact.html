<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact - SmartBus</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/contact.css') }}">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-bus"></i>
            SmartBus
        </div>

        <ul class="nav-links">

            <li>
                <a href="{{ url_for('home') }}">Home</a>
            </li>

            <li>
                <a href="{{ url_for('routes') }}">Routes</a>
            </li>

            <li>
                <a href="{{ url_for('bus_stops') }}">Bus Stops</a>
            </li>

            <li>
                <a href="{{ url_for('tracking') }}">Live Tracking</a>
            </li>

            <li>
                <a href="{{ url_for('ai_prediction') }}">AI Prediction</a>
            </li>

            <li>
                <a href="{{ url_for('weather') }}">Weather</a>
            </li>

        </ul>

        <div class="nav-buttons">

            <a href="{{ url_for('login') }}"
               class="login-btn">
                Login
            </a>

            <a href="{{ url_for('register') }}"
               class="register-btn">
                Register
            </a>

        </div>

    </nav>

</header>


<main class="contact-page">

    <div class="contact-box">

        <i class="fa-solid fa-envelope"></i>

        <h1>
            Contact SmartBus
        </h1>

        <p>
            Have questions or suggestions?
            Contact our SmartBus team.
        </p>


        <div class="contact-info">

            <p>
                <i class="fa-solid fa-location-dot"></i>
                Chennai, Tamil Nadu
            </p>

            <p>
                <i class="fa-solid fa-phone"></i>
                +91 98765 43210
            </p>

            <p>
                <i class="fa-solid fa-envelope"></i>
                smartbus@gmail.com
            </p>

        </div>


        <form>

            <input
                type="text"
                placeholder="Your Name"
                required>

            <input
                type="email"
                placeholder="Your Email"
                required>

            <textarea
                rows="5"
                placeholder="Your Message"
                required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</main>

</body>

</html>

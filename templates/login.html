<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Bus</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-box">

                <h1>🚌 Smart Bus</h1>

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to access Smart Bus services
                </p>

                <!-- Login Form -->

                <form method="POST"
                      action="{{ url_for('login') }}">

                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <!-- Password -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>

                </form>

                <!-- Register Link -->

                <p class="register-text">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
